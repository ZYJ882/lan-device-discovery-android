name: Build and publish Android release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Build debug APK
        run: ./gradlew --no-daemon clean :app:assembleDebug

      - name: Package clean source
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/lan-device-discovery-${GITHUB_REF_NAME}-debug.apk"
          git archive --format=zip --prefix="lan-device-discovery-android-${GITHUB_REF_NAME}/" HEAD \
            -- ':!releases/*/*.apk' ':!*.zip' ':!*.sha256'
          mv "lan-device-discovery-android-${GITHUB_REF_NAME}.zip" "release/lan-device-discovery-${GITHUB_REF_NAME}-source-clean.zip"
          sha256sum release/* > release/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 局域网设备发现 ${{ github.ref_name }}
          body_path: releases/${{ github.ref_name }}/RELEASE_NOTES.md
          files: |
            release/lan-device-discovery-${{ github.ref_name }}-debug.apk
            release/lan-device-discovery-${{ github.ref_name }}-source-clean.zip
            release/SHA256SUMS.txt
          generate_release_notes: false
